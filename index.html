<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindFrame — Timeboxing & Habits</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo" aria-hidden="true">⏱️</div>
      <h1>MindFrame</h1>
      <span class="subtitle">Timeboxing & Habits</span>
    </div>
    <div class="exporter">
      <label for="exportFormat" class="sr-only">Exportformat</label>
      <select id="exportFormat" title="Exportformat wählen">
        <option value="csv">CSV</option>
        <option value="md">Markdown</option>
        <option value="ics">ICS (Kalender)</option>
        <option value="pdf">PDF</option>
        <option value="xlsx">XLSX (CSV-Hack)</option>
      </select>
      <button id="exportButton" class="btn" title="Nur geplante Tasks exportieren">Exportieren</button>
    </div>
    <div class="meta-controls">
      <a href="anleitung.html" class="btn btn-ghost" target="_blank" title="Anleitung öffnen">?</a>
      <a href="impressum.html" class="btn btn-ghost" title="Impressum">§</a>
    </div>
  </header>

  <main class="app">
    <section class="left">
      
      <div class="panel mindset-panel">
        <div class="panel-header">
          <h2>Daily Mindset</h2>
        </div>
        
        <div class="progress-section">
          <div class="progress-row">
            <div class="progress-label">
              <span>Tasks erledigt</span>
              <span id="task-percent">0%</span>
            </div>
            <div class="progress-track">
              <div id="task-bar" class="progress-fill" style="width: 0%"></div>
            </div>
          </div>
          <div class="progress-row">
            <div class="progress-label">
              <span>Habits</span>
              <span id="habit-percent">0%</span>
            </div>
            <div class="progress-track">
              <div id="habit-bar" class="progress-fill fill-habit" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div id="habit-list" class="habit-list">
          </div>

        <div class="add-row">
          <input type="text" id="new-habit-input" placeholder="+ Neue Gewohnheit..." autocomplete="off">
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Tasks zum Einplanen</h2>
          <button class="btn btn-small" id="btnClearDone" title="Erledigte Tasks löschen">Aufräumen</button>
        </div>
        
        <div class="add-row">
          <input type="text" id="newTaskInput" placeholder="+ Neuer Task (Enter)" autocomplete="off" />
          <select id="newPriority" title="Priorität">
            <option value="1">High</option>
            <option value="2" selected>Normal</option>
            <option value="3">Low</option>
          </select>
        </div>

        <div id="todo-list" class="task-list source-list">
          </div>
      </div>
    </section>

    <section class="right">
      <div class="panel" style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
        <div class="panel-header">
          <h2>Tages-Schedule <span class="muted">(Klick auf Task = Erledigt)</span></h2>
        </div>

        <div id="schedule" class="schedule">
          <div class="schedule-section">
            <button class="section-toggle" data-target="#sec-night" aria-expanded="false">Nacht (00–06)</button>
            <div id="sec-night" class="section-body" data-range-start="0" data-range-end="24" hidden></div>
          </div>
          <div class="schedule-section">
            <button class="section-toggle" data-target="#sec-morning" aria-expanded="false">Morgen (06–12)</button>
            <div id="sec-morning" class="section-body" data-range-start="24" data-range-end="48" hidden></div>
          </div>
          <div class="schedule-section">
            <button class="section-toggle" data-target="#sec-midday" aria-expanded="false">Mittag (12–18)</button>
            <div id="sec-midday" class="section-body" data-range-start="48" data-range-end="72" hidden></div>
          </div>
          <div class="schedule-section">
            <button class="section-toggle" data-target="#sec-evening" aria-expanded="false">Abend (18–24)</button>
            <div id="sec-evening" class="section-body" data-range-start="72" data-range-end="96" hidden></div>
          </div>
        </div>
        
        <div id="trash-zone" class="trash-zone">
          <span>🗑️ Hierhin ziehen zum Löschen</span>
        </div>
      </div>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog">
      <h3>Task bearbeiten</h3>
      <label>
        Titel:
        <input type="text" id="editTitle" required />
      </label>
      <label>
        Priorität:
        <select id="editPriority">
          <option value="1">Hoch (!!!)</option>
          <option value="2">Mittel</option>
          <option value="3">Niedrig</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Abbrechen</button>
        <button value="save" class="btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
